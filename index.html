<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jaen Youth Brothers Association Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Jaen Youth Brothers Association Hub</h1>

        <p>Monthly Contribution Management System</p>

        <hr>

        <h2>Login</h2>

        <p>Please select your account type.</p>

        <button id="memberLoginBtn">
            Member Login
        </button>

        <button id="adminLoginBtn">
            Administrator Login
        </button>

    </div>


    <div class="card" id="loginSection" style="display:none;">

        <h2 id="loginTitle">Member Login</h2>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
                autocomplete="email"
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase configuration -->
<script src="js/supabase.js"></script>

<!-- Application -->
<script src="js/app.js"></script>

</body>

</html>
