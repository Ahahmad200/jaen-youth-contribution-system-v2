<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jaen Youth Brothers Association Hub</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ==========================================
           JYBA HOMEPAGE HEADER
           ========================================== */

        .jyba-header {
            text-align: center;
            padding: 25px 15px 20px;
        }

        .jyba-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 50%;
            display: block;
            margin: 0 auto 15px;
        }

        .jyba-name {
            margin: 0;
            font-size: 28px;
            line-height: 1.25;
            font-weight: 700;
        }

        .jyba-motto {
            margin: 10px 0 0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .jyba-description {
            margin: 8px 0 0;
            font-size: 15px;
        }

        /* Mobile phone adjustment */
        @media (max-width: 600px) {

            .jyba-logo {
                width: 125px;
                height: 125px;
            }

            .jyba-name {
                font-size: 23px;
            }

            .jyba-motto {
                font-size: 13px;
            }

            .jyba-description {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ==========================================
         JYBA ASSOCIATION HEADER
         ========================================== -->

    <div class="card jyba-header">

        <img
            src="jyba-logo.png"
            alt="Jaen Youth Brothers Association Logo"
            class="jyba-logo"
        >

        <h1 class="jyba-name">
            Jaen Youth Brothers Association
        </h1>

        <p class="jyba-motto">
            UNITE. INSPIRE. THRIVE. AS ONE.
        </p>

        <p class="jyba-description">
            Association Hub & Monthly Contribution Management System
        </p>

    </div>


    <!-- ==========================================
         LOGIN SELECTION
         ========================================== -->

    <div class="card">

        <h2>Login</h2>

        <p>Please select your account type.</p>

        <button id="memberLoginBtn">
            Member Login
        </button>

        <button id="adminLoginBtn">
            Administrator Login
        </button>

    </div>


    <!-- ==========================================
         LOGIN FORM
         ========================================== -->

    <div class="card" id="loginSection" style="display:none;">

        <h2 id="loginTitle">Member Login</h2>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
                autocomplete="email"
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase configuration -->
<script src="js/supabase.js"></script>

<!-- Application -->
<script src="js/app.js"></script>

</body>

</html>
