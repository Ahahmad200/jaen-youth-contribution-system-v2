<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Jaen Youth Brothers Association Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Administrator Dashboard</h1>

        <p id="adminName">Loading administrator...</p>

        <hr>

        <h2>Jaen Youth Brothers Association Hub</h2>

        <p>Administrator access confirmed.</p>

        <p id="adminStatus">
            Checking account...
        </p>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script>

async function loadAdmin() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

        window.location.href = "index.html";

        return;
    }

    const {
        data: member,
        error: memberError
    } = await supabaseClient
        .from("members")
        .select("full_name, member_id, role")
        .eq("auth_user_id", user.id)
        .single();

    if (
        memberError ||
        !member ||
        member.role !== "admin"
    ) {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";

        return;
    }

    document.getElementById("adminName").textContent =
        "Welcome, " + member.full_name;

    document.getElementById("adminStatus").textContent =
        "Administrator account verified successfully.";
}


document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";
    });


loadAdmin();

</script>

</body>

</html>
