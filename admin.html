<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Jaen Youth Brothers Association Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Administrator Dashboard</h1>

        <p>
            Welcome,
            <strong id="adminName">Loading...</strong>
        </p>

        <p>
            Member ID:
            <strong id="adminMemberId">Loading...</strong>
        </p>

        <hr>

        <h2>Dashboard Overview</h2>

        <p>
            Total Members:
            <strong id="totalMembers">0</strong>
        </p>

        <p>
            Contribution Records:
            <strong id="totalRecords">0</strong>
        </p>

        <p>
            Total Contributions:
            <strong id="totalContributions">0</strong>
        </p>

        <hr>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</div>


<!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase configuration -->
<script src="js/supabase.js"></script>

<!-- Admin dashboard -->
<script src="js/admin.js"></script>

</body>

</html>
