<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Member Dashboard | Jaen Youth Brothers Association Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Jaen Youth Brothers Association Hub</h1>

        <h2>Member Dashboard</h2>

        <p>
            Welcome,
            <strong id="memberName">Loading...</strong>
        </p>

        <p>
            Member ID:
            <strong id="memberId">Loading...</strong>
        </p>

        <hr>

        <div class="card">
            <h2>Total Contribution</h2>

            <h1>
                ₦<span id="memberTotal">0</span>
            </h1>
        </div>

        <hr>

        <h2>My Contribution History</h2>

        <div id="contributionList">
            Loading contributions...
        </div>

        <hr>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/member.js?v=2"></script>

</body>
</html>
